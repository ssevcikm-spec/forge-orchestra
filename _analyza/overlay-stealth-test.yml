# Testovací overlay pro profil `headless`.
# Ověřuje přesně ten blok providera, který se pak vloží do profilu `desktop`:
# deklarovaná route na OpenRouter (api + baseURL + models), model
# stealth/space-bunny-alpha s reasoningEfforts, klíč přes credential ref.
# Pozor: dsh-base už řádek `llm-pi-ai` mountuje, takže se cílí podle id
# (config se nahrazuje CELÝ, ne slévá).
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openrouter-stealth:
        displayName: OpenRouter - Space Bunny (stealth)
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        models:
          - id: stealth/space-bunny-alpha
            name: Space Bunny Alpha (stealth)
            contextWindow: 1000000
            maxTokens: 524288
            input:
              - text
              - image
            reasoningEfforts:
              low: low
              medium: medium
              high: high
              xhigh: xhigh
              max: max
- id: agent-default-model
  config:
    provider: openrouter-stealth
    model: stealth/space-bunny-alpha
    reasoningEffort: high
